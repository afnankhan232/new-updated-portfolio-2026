<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin sign-in challenge">
  <title>Quick Check | Afnan Khan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode admin-page">
<canvas id="particles-canvas" aria-hidden="true"></canvas>
<header class="navbar admin-navbar" id="navbar">
  <a class="logo logo-link" href="index.html">Afnan Khan</a>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
  </nav>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
</header>
<main class="admin-main">
  <section class="admin-gate-layout">
    <div class="admin-scene" id="adminScene">
      <div class="admin-scene-kicker">PRIVATE WORKSPACE</div>
      <h1>One quick<br><span class="grad-text">check.</span></h1>
      <div class="mascot" id="mascot" aria-hidden="true">
        <div class="mascot-ear mascot-ear-left"></div>
        <div class="mascot-ear mascot-ear-right"></div>
        <div class="mascot-head">
          <div class="mascot-eye mascot-eye-left"><span></span></div>
          <div class="mascot-eye mascot-eye-right"><span></span></div>
          <div class="mascot-cheek mascot-cheek-left"></div>
          <div class="mascot-cheek mascot-cheek-right"></div>
          <div class="mascot-mouth"></div>
        </div>
        <div class="mascot-body"><span></span></div>
      </div>
      <div class="admin-scene-star admin-scene-star-one"></div>
      <div class="admin-scene-star admin-scene-star-two"></div>
      <div class="admin-scene-star admin-scene-star-three"></div>
      <div class="admin-scene-floor"></div>
    </div>
    <form id="captchaForm" class="admin-panel admin-gate-panel">
      <p class="section-label">QUICK CHECK</p>
      <h2>Before you continue</h2>
      <label id="captchaQuestion" for="captchaAnswer">Solve the calculation</label>
      <input id="captchaAnswer" name="answer" type="number" inputmode="numeric" autocomplete="off" required>
      <button class="btn btn-primary admin-submit" type="submit">Continue <span aria-hidden="true">&#8594;</span></button>
      <p id="captchaStatus" class="admin-status" role="status" aria-live="polite">Answer the simple calculation to continue to admin sign-in.</p>
    </form>
  </section>
</main>
<footer class="admin-footer"><span>Afnan Khan</span><span>Private portfolio workspace</span></footer>
<script src="theme.js"></script>
<script src="admin-gate.js?v=20260930" defer></script>
<script src="particles.js" defer></script>
</body>
</html>
